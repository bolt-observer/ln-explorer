<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>bolt.observer — Lightning Network explorer</title>
    <meta
      name="description"
      content="Public Lightning Network explorer: live gossip graph, node and channel pages, search, and network stats."
    />
    <!-- Bump ?v= whenever an icon changes: browsers cache favicons far longer than HTTP says. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#070908" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/app.css" />
    <!--PLAUSIBLE-->
  </head>
  <body data-mode="map">
    <div id="map-layer" class="map-layer" role="region" aria-label="Lightning Network map. Use search to reach any node or channel by keyboard."><div id="map" class="map"></div></div>
    <header id="topbar" class="topbar"><a class="brand" href="/">bolt.observer</a></header>
    <div id="banner" class="banner" role="status" hidden></div>
    <main id="view"></main>
    <noscript><p style="padding:96px 24px;text-align:center">bolt.observer needs JavaScript to draw the Lightning Network map.</p></noscript>
    <script src="/static/app.js"></script>
  </body>
</html>
