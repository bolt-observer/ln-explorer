<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bolt.observer — Lightning Network explorer</title>
    <meta
      name="description"
      content="Public Lightning Network explorer: live gossip graph, node and channel pages, search, and network stats."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#121212" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
    <!--PLAUSIBLE-->
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <img src="/logo.svg" alt="" width="36" height="36" />
        <span class="brand-text">
          <span>bolt<span class="dot">.</span>observer</span>
          <span class="brand-sub">Lightning explorer</span>
        </span>
      </a>
      <nav>
        <a href="/" data-nav="graph">Graph</a>
        <a href="/nodes" data-nav="nodes">Nodes</a>
        <a href="/rankings" data-nav="rankings">Rankings</a>
        <a href="/stats" data-nav="stats">Stats</a>
      </nav>
      <form id="search-form" role="search">
        <input
          id="search-input"
          type="search"
          name="q"
          placeholder="Alias, pubkey, or channel"
          autocomplete="off"
          aria-label="Search the Lightning Network"
        />
      </form>
    </header>
    <div id="sync-banner" class="sync-banner" hidden></div>
    <main id="app"></main>
    <footer>
      <span>
        © bolt.observer <span id="footer-year"></span> · data: LDK rapid gossip sync · mempool.space ·
        <a href="https://github.com/bolt-observer/ln-explorer">source on GitHub</a> · no cookies, no tracking
      </span>
      <span id="footer-meta"></span>
    </footer>
    <script src="/static/app.js"></script>
  </body>
</html>
